syntax = "proto3";

import "type.proto";
import "google/protobuf/empty.proto";

package room;

option go_package = "github.com/fajarilf/grpc-chat/proto-go";

enum BgTypes {
    COLOR = 0;
    IMAGE = 1;
}

message RoomCreateRequest {
    string name = 1;
    string description = 2;
    string background = 3;
    BgTypes background_type = 4;
    repeated int32 user_ids = 5;
}

message RoomListRequest {
    bool forward = 1;
    int32 cursor = 2;
    int32 size = 3;
}

message RoomId {
    int32 id = 1;
}

message RoomResponseWithUser {
    int32 id = 1;
    string name = 2;
    string description = 3;
    string background = 4;
    string background_type = 5;
    repeated type.UserResponse users = 6;
}

message RoomListResponse {
    repeated RoomResponseWithUser rooms = 1;
    int32 next_cursor = 2;
    int32 prev_cursor = 3;
    bool has_more = 4;
}

service RoomService {
    rpc CreateRoom(RoomCreateRequest) returns (RoomResponseWithUser);
    rpc GetRoomById(RoomId) returns (RoomResponseWithUser);
    rpc GetListRoom(RoomListRequest) returns (RoomListResponse);
    rpc DeleteRoom(RoomId) returns (google.protobuf.Empty);
}
