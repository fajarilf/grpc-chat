get:
  tags:
    - Rooms
  summary: Get All Rooms
  description: Returns a paged list of rooms.
  parameters:
    - in: query
      name: forward
      required: false
      schema:
        type: boolean
        default: true
      description: Paging direction. Defaults to true.
    - in: query
      name: cursor
      required: false
      schema:
        type: integer
        default: 1
      description: Index to start the page from. Defaults to 1.
    - in: query
      name: size
      required: false
      schema:
        type: integer
        default: 10
      description: Maximum number of rooms to return. Defaults to 10.
  responses:
    "200":
      description: List of Rooms
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  rooms:
                    type: array
                    items: &RoomResponse
                      type: object
                      properties:
                        name:
                          type: string
                          example: Room 101
                        description:
                          type: string
                          example: General engineering chat
                        background:
                          type: string
                          description: A hex color or an image URL.
                          example: "#0284c7"
                        backgroundType:
                          type: string
                          description: Background kind, COLOR or IMAGE.
                          example: COLOR
                        users:
                          type: array
                          items: &UserResponse
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 6
                              name:
                                type: string
                                example: Fajar Ilham
                              username:
                                type: string
                                example: fajar
                              rooms:
                                type: array
                                description: Rooms the user belongs to.
                                items:
                                  type: object
post:
  tags:
    - Rooms
  summary: Create New Room
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              example: Room 101
            description:
              type: string
              example: General engineering chat
            background:
              type: string
              description: A hex color (e.g. "#0284c7") or an image URL.
              example: "#0284c7"
            backgroundType:
              type: integer
              enum: [0, 1]
              description: Background kind. 0 = COLOR, 1 = IMAGE.
              example: 0
            usersIds:
              type: array
              items:
                type: string
              description: IDs of users to add as members.
              example: ["1", "3", "8"]
  responses:
    "200":
      description: The created Room
      content:
        application/json:
          schema:
            type: object
            properties:
              data: *RoomResponse
