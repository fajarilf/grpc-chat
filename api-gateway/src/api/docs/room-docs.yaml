# Path-item for /rooms
rooms:
  get:
    tags:
      - Rooms
    summary: Get All Rooms
    description: Returns a paged list of rooms.
    parameters:
      - in: query
        name: forward
        required: false
        schema:
          type: boolean
          default: true
        description: Paging direction. Defaults to true.
      - in: query
        name: cursor
        required: false
        schema:
          type: integer
          default: 1
        description: Index to start the page from. Defaults to 1.
      - in: query
        name: size
        required: false
        schema:
          type: integer
          default: 5
        description: Maximum number of rooms to return. Defaults to 10.
    responses:
      "200":
        description: List of Rooms
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                data:
                  type: array
                  items:
                    $ref: "./main-docs.yaml#/components/schemas/RoomResponse"
                nextCursor:
                  type: integer
                  description: Lowest id on this page; pass it back to fetch older rooms.
                  example: 12
                prevCursor:
                  type: integer
                  description: Highest id on this page; pass it back to fetch newer rooms.
                  example: 23
                hasMore:
                  type: boolean
                  description: Whether another page exists in the scroll direction.
                  example: true
  post:
    tags:
      - Rooms
    summary: Create New Room
    description: Create new room and return the created room
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                example: Room 101
              description:
                type: string
                example: General engineering chat
              background:
                type: string
                description: A hex color (e.g. "#0284c7") or an image URL.
                example: "#0284c7"
              background_type:
                type: integer
                enum: [0, 1]
                description: Background kind. 0 = COLOR, 1 = IMAGE.
                example: 0
              user_ids:
                type: array
                items:
                  type: integer
                description: IDs of users to add as members.
                example: [ 1, 3, 8 ] 
    responses:
      "200":
        description: The created Room
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                data:
                  $ref: "./main-docs.yaml#/components/schemas/RoomResponse"

# Path-item for /rooms/{roomId}
rooms-by-id:
  get:
    tags:
      - Rooms
    summary: Get Room by id
    description: Return selected room based on Room Id
    parameters:
      - in: path
        name: roomId
        required: true
        description: Id of the room.
        schema:
          type: integer
    responses:
      "200":
        description: The selected Room
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                data:
                  $ref: "./main-docs.yaml#/components/schemas/RoomResponse"
