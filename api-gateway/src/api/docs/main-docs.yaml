openapi: 3.0.0
info:
  title: "gRPC API Docs"
  version: "1.0.0"
servers:
  - url: "/api"
tags:
  - name: Rooms
    description: Room listing and creation
paths:
  /rooms:
    $ref: "./room-docs.yaml#/rooms"
  /rooms/{roomId}:
    $ref: "./room-docs.yaml#/rooms-by-id"
components:
  schemas:
    RoomResponse:
      type: object
      properties:
        id:
          type: integer
          example: 6
        name:
          type: string
          example: Room 101
        description:
          type: string
          example: General engineering chat
        background:
          type: string
          description: A hex color or an image URL.
          example: "#0284c7"
        backgroundType:
          type: string
          description: Background kind, COLOR or IMAGE.
          example: COLOR
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 6
        name:
          type: string
          example: Fajar Ilham
        username:
          type: string
          example: fajar